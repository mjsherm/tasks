# Builds a Universal (Apple Silicon + Intel) DMG on GitHub's Mac runners and
# attaches it to a GitHub Release. Push a tag like v0.2.0 to cut a release.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:mac
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v$(node -p 'require(\"./package.json\").version')" ;; esac
          gh release create "$TAG" release/*.dmg --title "Tasks ${TAG#v}" --notes-file .github/release-notes.md || \
            gh release upload "$TAG" release/*.dmg --clobber
